{extend name="public/form" /}

{block name="body"}
	<div class="layui-card">
		<div class="layui-card-body">
			<div id="tree"></div>
		</div>
	</div>

	<div class="bottom" style="position: fixed">
		<div class="button-container">
			<button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit="" id="save"
				lay-filter="user-save">
				<i class="layui-icon layui-icon-ok"></i>
				提交
			</button>
			<button type="reset" class="pear-btn pear-btn-sm">
				<i class="layui-icon layui-icon-refresh"></i>
				重置
			</button>
		</div>
	</div>


{__block__}

<script>
	const ADMIN_LIST = MODULE_NAME + '/system/AuthRole/getAdmins' + location.search;
	const SAVE_AUTH = MODULE_NAME + '/system/AuthRole/auth';

	layui.use(['tree','layer','jquery'], function(){
		const tree = layui.tree;
		const layer = layui.layer;
		const $ = layui.jquery;

		let roleId = layui.url().search.id;
		// 选中的用户id数组
		let selectedIds = [];
		// 编辑回显：后端输出已授权id数组，如 let defaultCheckedIds = [1,3];
		let defaultCheckedIds = [];

		// 后端直接返回：[{"id":1,"username":"admin"},{"id":2,"username":"test"}]
		$.get(ADMIN_LIST, function(res) {
			defaultCheckedIds = res.data.ids;
			tree.render({
				elem:'#tree',
				id: 'tree',
				data: res.data.admins,
				showCheckbox:true,
				spread: false,
				onlyIconControl:true,
				// ✅ 核心：字段映射，不再需要map
				customName: {
					id: 'id',
					title: 'username',
					children: 'children'
				}
			});

			// 回显勾选
			if(defaultCheckedIds.length>0){
				tree.setChecked('tree', defaultCheckedIds);
			}

		},'json');

		$('#save').click(function () {
			// 获取选中的节点数据
			const checkedNodes = tree.getChecked('tree');
			selectedIds = checkedNodes.map(item=>item.id);

			$.post(SAVE_AUTH, {
				role_id: roleId,
				admin_ids: selectedIds
			}, res =>{
				layer.msg(res.msg, {
					icon: 1,
					time: 1000
				}, function() {
					parent.layer.close(parent.layer.getFrameIndex(window.name)); //关闭当前页
				});
			},'json');

			// $.ajax({
			// 	url: SAVE_AUTH,
			// 	method: 'POST',
			// 	data: { role_id: roleId, admin_ids: selectedIds },
			// 	success(res) {
			// 		if (res.code === 200) {
			// 			layer.msg('保存成功');
			// 		} else {
			// 			layer.msg(res.msg || '保存失败');
			// 		}
			// 	}
			// })
		})

	});
</script>

</body>
</html>

 
{/block}
