{extend name="public/base" /}

{block name="title"}权限菜单{/block}
{block name="head"}
<style>
    .group-actions{margin-top:16px;}
    .upload-wrap{display:flex;gap:10px;align-items:center;}
    .kv-row { display: flex; align-items: center; margin-bottom: 5px; gap: 5px; }
    .kv-row input { flex: 1; }
    .kv-row .layui-btn { flex-shrink: 0; }
</style>
{/block}

{block name="body"}

<div class="layui-card">
    <div class="layui-card-body">
        <!-- 用 layui-tabs 按 group 分组 -->
        <div class="layui-tab layui-tab-brief" lay-filter="cfgTabs" id="cfgTabs">
            <ul class="layui-tab-title" id="tabTitle"></ul>
            <div class="layui-tab-content" id="tabContent"></div>
        </div>
    </div>
</div>

{__block__}

<script>
    // 文件上传接口（根据你的项目实际地址调整）
    const UPLOAD_URL = MODULE_NAME + '/system/set/upload';
    const FORM_DATA_URL = MODULE_NAME + '/system/config/getFormData';
    const BATCH_SAVE_URL = MODULE_NAME + '/system/config/batchSave';

layui.use(['form','jquery','layer','laydate','upload','element'],function(){
    var $ = layui.jquery;
    var form = layui.form;
    var layer = layui.layer;
    var laydate = layui.laydate;
    var upload = layui.upload;
    var element = layui.element;

    // 需要 options 的可选类型（与配置项管理页保持一致）
    const OPTION_TYPES = ['radio','checkbox','select'];

    /**
     * 渲染单个配置项的表单控件，返回html
     * @param item 配置项 {name,title,tip,type,value,options}
     */
    function renderControl(item){
        let html = '<div class="layui-form-item">';
        html += '<label class="layui-form-label">'+(item.title||'')+'<br>'+(item.name||'')+'</label>';
        html += '<div class="layui-input-block">';

        // 关键兜底：options 为 null / undefined 强制转为空数组
        let opts = item.options || [];

        switch(item.type) {
            case 'text':
                html += `<input type="text" name="${item.name}" value="${item.value||''}" class="layui-input">`;
                break;

            case 'number':
                html += `<input type="number" name="${item.name}" value="${item.value||''}" class="layui-input">`;
                break;

            case 'switch':
                // 开关：1开启 0关闭；兼容value为null
                const chk = String(item.value ?? '0') === '1' ? 'checked' : '';
                html += `<input type="checkbox" name="${item.name}" lay-skin="switch" ${chk}>`;
                break;

            case 'radio':
                for(var i=0;i<opts.length;i++){
                    var o=opts[i];
                    var rchk = String(item.value ?? '')===String(o.value)?'checked':'';
                    html += `<input type="radio" name="${item.name}" value="${o.value}" title="${o.label}" ${rchk}>`;
                }
                break;

            case 'checkbox':
                var vals = (item.value||'');
                for(var i=0;i<opts.length;i++){
                    var o=opts[i];
                    var cchk = vals.includes(String(o.value))?'checked':'';
                    html += `<input type="checkbox" name="${item.name}[]" value="${o.value}" title="${o.label}" ${cchk}>`;
                }
                break;

            case 'select':
                html += `<select name="${item.name}">`;
                html += `<option value="">请选择</option>`;
                for(var i=0;i<opts.length;i++){
                    var o=opts[i];
                    var schk = String(item.value ?? '')===String(o.value)?'selected':'';
                    html += `<option value="${o.value}" ${schk}>${o.label}</option>`;
                }
                html += `</select>`;
                break;
            case 'year':
                // 日期：value存日期字符串，laydate渲染
                html += `<input class="layui-input cfg-layyear" name="${item.name}" value="${item.value||''}" readonly placeholder="请选择年份">`;
                break;
            case 'month':
                // 日期：value存日期字符串，laydate渲染
                html += `<input class="layui-input cfg-laymonth" name="${item.name}" value="${item.value||''}" readonly placeholder="请选择月份">`;
                break;
            case 'date':
                // 日期：value存日期字符串，laydate渲染
                html += `<input class="layui-input cfg-laydate" name="${item.name}" value="${item.value||''}" readonly placeholder="请选择日期">`;
                break;
            case 'time':
                // 日期：value存日期字符串，laydate渲染
                html += `<input class="layui-input cfg-laytime" name="${item.name}" value="${item.value||''}" readonly placeholder="请选择时间">`;
                break;
            case 'datetime':
                // 日期：value存日期字符串，laydate渲染
                html += `<input class="layui-input cfg-laydatetime" name="${item.name}" value="${item.value||''}" readonly placeholder="请选择日期时间">`;
                break;
            case 'phone':
                html += `<input type="text" name="${item.name}" value="${item.value||''}" lay-verify="required|phone" class="layui-input">`;
                break;
            case 'email':
                html += `<input type="text" name="${item.name}" value="${item.value||''}" lay-verify="required|email" class="layui-input">`;
                break;
            case 'url':
                html += `<input type="text" name="${item.name}" value="${item.value||''}" lay-verify="required|url" class="layui-input">`;
                break;
            case 'identity':
                html += `<input type="text" name="${item.name}" value="${item.value||''}" lay-verify="required|identity" class="layui-input">`;
                break;
            case 'array':
                // 键值对行，直接返回对象（非 JSON 字符串）
                var containerId = 'value_kv_container';
                var obj = (typeof item.value === 'object' && item.value !== null) ? item.value : {};
                html += '<div class="kv-container" id="' + containerId + '">';
                var keys = Object.keys(obj);
                if (keys.length === 0) {
                    html += '<div class="kv-row">' +
                        '<input type="text" class="layui-input kv-key" placeholder="键(Key)" value="" style="flex:1;">' +
                        '<input type="text" class="layui-input kv-value" placeholder="值(Value)" value="" style="flex:1;">' +
                        '<button type="button" class="layui-btn layui-btn-sm layui-btn-danger kv-del">删除</button>' +
                        '</div>';
                } else {
                    obj.forEach(function(v){
                        for(var k in v){
                        html += '<div class="kv-row">' +
                            '<input type="text" class="layui-input kv-key" placeholder="键(Key)" value="' + k + '" style="flex:1;">' +
                            '<input type="text" class="layui-input kv-value" placeholder="值(Value)" value="' + v[k] + '" style="flex:1;">' +
                            '<button type="button" class="layui-btn layui-btn-sm layui-btn-danger kv-del">删除</button>' +
                            '</div>';
                        }
                    });
                }
                html += '</div>';
                html += '<button type="button" class="layui-btn layui-btn-sm layui-btn-primary add-kv-row-btn">添加行</button>';
                break;
            case  'image':
            case 'file':
            case 'upload':
                // 上传类型：input存储value(文件地址) + 上传按钮 + 文件类型标签 + 图片预览
                let fileUrl = item.value||'';
                let ext = parseFileExtFromUrl(fileUrl);
                let fType = getFileTypeByExt(ext);
                let tag = getFileTagInfo(fType);

                let previewHtml = '';
                // 图片类型显示缩略预览
                if(fileUrl && fType === 'image'){
                    previewHtml = `<img src="${fileUrl}" style="max-height:28px;max-width:240px;">`;
                } else {
                    previewHtml = `<span class="layui-badge ${tag.cls} file-type-tag">${tag.text}</span>`;
                }

                // 上传类型：input存储value(文件地址) + 上传按钮，上传成功回调回填
                html += `
                <div class="layui-input-wrap upload-wrap">
                    ${previewHtml}
                    <input class="layui-input cfg-upload-input" name="${item.name}" value="${item.value||''}" placeholder="文件地址/上传后自动填充">
                    <button type="button" class="layui-btn layui-btn-primary cfg-upload-btn">选择文件</button>
                </div>`;
                break;
            case 'areatext':
                // 多行文本域 textarea
                html += `<textarea class="layui-textarea" name="${item.name}" rows="4">${item.value||''}</textarea>`;
            break;

            default:
                html += `<input type="text" name="${item.name}" value="${item.value||''}" class="layui-input">`;
        }

        html += '</div>';
        if(item.tip){
            html += '<div class="layui-input-block">';
            html += '<div class="layui-form-mid layui-word-aux">'+item.tip+'</div>';
            html += '</div>';
        }
        html += '</div>';
        return html;
    }


    /**
     * 初始化容器内所有日期组件（date类型）
     */
    function initLaydate($container){
        $container.find('.cfg-laydate').each(function(){
            laydate.render({ elem: this, type:'date' });
        });
    }

    /**
     * 初始化容器内所有上传组件（upload类型）
     * 上传成功后，把返回的url回填到同组input
     */
    function initUploads($container){
        $container.find('.cfg-upload-btn').each(function(){
            var $btn = $(this);
            upload.render({
                elem: this,
                url: UPLOAD_URL,
                accept: 'file', // 普通文件
                exts: 'jpg|jpeg|png|gif|mp3|avi|mpg|m4|zip|rar|7z',
                done: function(res){
                    if(res.code===0){
                        // 上传成功，回填url到同行的input
                        $btn.closest('.upload-wrap').find('.cfg-upload-input').val(res.data.url);
                        layer.msg('上传成功',{icon:1,time:1000});
                    }else{
                        layer.msg(res.msg||'上传失败',{icon:2});
                    }
                },
                error: function(){
                    layer.msg('上传请求异常',{icon:2});
                }
            });
        });
    }

    /**
     * 渲染分组tabs
     */
    function loadForm(){
        $.post(FORM_DATA_URL, {}, function(res){
            if(res.code !== 0) return layer.msg(res.msg,{icon:2});
            var groupData = res.data || {};   // [{id, group_name, group_title, config:[] }]

            // 渲染tab标题
            var titleHtml = '';
            groupData.forEach(function(g, idx){
                titleHtml += `<li ${idx===0?'class="layui-this"':''}>${g.group_title}</li>`;
            });

            $('#tabTitle').html(titleHtml);

            // 渲染tab内容：每个group一个独立form
            var contentHtml = '';
            groupData.forEach(function(g, idx){
                var items = g.config||[]; // 配置数据
                var inner = '';
                items.forEach(function(item){
                    if(item.status !== 1) return; // 跳过禁用项
                    inner += renderControl(item);
                });
                // 隐藏group字段，用于提交时标识分组
                inner += `<input type="hidden" name="_group" value="${g.id}">`;
                // 该分组的保存按钮
                inner += `<div class="layui-form-item group-actions">
                    <div class="layui-input-block">
                        <button class="pear-btn pear-btn-primary" lay-submit lay-filter="groupSave">保存 ${g.group_title}</button>
                    </div>
                </div>`;

                // form 去掉 lay‑filter="cfgForm"
                contentHtml += `<div class="layui-tab-item ${idx===0?'layui-show':''}">
                    <form class="layui-form">${inner}</form>
                </div>`;
            });

            $('#tabContent').html(contentHtml);

            // 只渲染tab组件
            element.render('tab', 'cfgTabs');
            // 全局渲染所有表单组件（switch/radio/select/checkbox）
            form.render();

            // 初始化日期、上传组件
            $('#tabContent').find('.layui-tab-item').each(function(){
                initLaydate($(this));
                initUploads($(this));
            });
        },'json');
    }

    /**
     * 根据扩展名判断文件类型
     * @param {string} ext 小写扩展名，如 jpg、mp4、zip
     * @returns {string} image|video|audio|archive|other
     */
    function getFileTypeByExt(ext){
        if(!ext) return 'other';
        ext = ext.toLowerCase().trim();
        const imageExts  = ['jpg','jpeg','png','gif','bmp','webp','svg'];
        const videoExts  = ['mp4','mov','avi','mkv','flv','wmv'];
        const audioExts  = ['mp3','wav','flac','aac','ogg'];
        const archiveExts= ['zip','rar','7z','tar','gz','bz2'];

        if(imageExts.includes(ext)) return 'image';
        if(videoExts.includes(ext)) return 'video';
        if(audioExts.includes(ext)) return 'audio';
        if(archiveExts.includes(ext)) return 'archive';
        return 'other';
    }

    /**
     * 从url路径解析文件扩展名
     * @param {string} url
     * @returns {string}
     */
    function parseFileExtFromUrl(url){
        if(!url) return '';
        const arr = url.split('?')[0].split('.');
        if(arr.length <2) return '';
        return arr.pop().toLowerCase();
    }

    /**
     * 获取类型对应的标签文字与样式class
     * @param {string} fileType
     * @returns {{text:string,cls:string}}
     */
    function getFileTagInfo(fileType){
        const map = {
            image:   {text:'图片',cls:'layui-bg-green'},
            video:   {text:'视频',cls:'layui-bg-blue'},
            audio:   {text:'音频',cls:'layui-bg-purple'},
            archive: {text:'压缩包',cls:'layui-bg-orange'},
            other:   {text:'其他',cls:'layui-bg-gray'}
        };
        return map[fileType] || map.other;
    }

    
    /**
     * 统一保存回调：data.field 就是当前触发form（当前group）的所有字段
     * 因每个group是独立form，天然只提交当前group数据
     */
    form.on('submit(groupSave)',function(data){
        var field = data.field;
        var system_group_id = field._group || '';

        // 当前group内的switch：未勾选时不提交，手动补0
        var $form = $(data.form);
        $form.find('input[lay-skin="switch"]').each(function(){
            var name = $(this).attr('name');
            if(!field.hasOwnProperty(name)){
                field[name] = '0';
            }
        });
        // switch勾选时layui提交的值为"on"，统一转1
        $form.find('input[lay-skin="switch"]:checked').each(function(){
            field[$(this).attr('name')] = '1';
        });

        // 删除辅助字段
        delete field._group;

        // 只提交当前group的数据
        $.post(BATCH_SAVE_URL, {system_group_id: system_group_id, ...field}, function(res){
            if(res.code === 0){
                layer.msg('保存成功',{icon:1});
            } else {
                layer.msg(res.msg,{icon:2});
            }
        },'json');
        return false;
    });

    loadForm();
});
</script>

{/block}
