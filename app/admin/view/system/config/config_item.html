{extend name="public/base" /}

{block name="title"}权限菜单{/block}
{block name="head"}
<style>
    .top-bar{margin-bottom:16px;}
    .search-wrap{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
    .option-panel{border:1px solid #e6e6e6;padding:12px;border-radius:6px;margin-top:8px;}
    .option-item{display:flex;gap:10px;margin-bottom:8px;align-items:center;}
    .kv-row { display: flex; align-items: center; margin-bottom: 5px; gap: 5px; }
    .kv-row input { flex: 1; }
    .kv-row .layui-btn { flex-shrink: 0; }
</style>
{/block}

{block name="body"}

<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form search-wrap">
            <input class="layui-input" id="kw" placeholder="搜索分组 / 配置键名" style="width:240px;">
            <button class="layui-btn layui-btn-primary" lay-submit lay-filter="table-search">搜索</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </form>
        <button class="layui-btn layui-btn-normal" id="addBtn">新增配置项</button>
    </div>
    <table id="itemTable" lay-filter="itemTable"></table>
</div>

<script type="text/html" id="tableBar">
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<!-- 状态开关模板 -->
<script type="text/html" id="statusTpl">
    <input type="checkbox" lay-skin="switch" lay-text="启用|禁用" lay-filter="tableStatusSwitch" data-id="{{d.id}}" {{d.status===1?'checked':''}} >
</script>

{__block__}

<script>

    const ITEM_LIST_URL = MODULE_NAME + '/system_config/item_list';
    const SAVE_ITEM_URL = MODULE_NAME + '/system_config/save_item';
    const DELETE_ITEM_URL = MODULE_NAME + '/system_config/delete_item';
    const UPDATE_SORT_URL = MODULE_NAME + '/system_config/update_sort';
    const UPDATE_STATUS_URL = MODULE_NAME + '/system_config/update_status';
    const UPLOAD_URL = MODULE_NAME + '/system/set/upload';

    layui.use(['table','form','jquery','layer','laydate'],function(){
        var $ = layui.jquery;
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var laydate = layui.laydate;
        var upload = layui.upload;

        const OPTION_TYPES = ['radio','checkbox','select'];
        const NORMAL_TYPES = ['text','number','switch','date','upload', 'textarea','year','month','time','datetime','image','file','phone','email','url','identity'];

        var tableIns = table.render({
            elem:'#itemTable',
            url: ITEM_LIST_URL,
            method:'post',
            // 开启单元格编辑，只对sort列生效
            edit:'text',
            cols:[[
                {field:'id',title:'ID',width:70},
                {field:'group',title:'分组',width:100},
                {field:'name',title:'键名'},
                {field:'title',title:'名称'},
                {field:'type',title:'表单类型',width:100,align:'center'},
                {field:'value',title:'配置值',minWidth:150, templet:'<div>{{#if (Array.isArray(d.value)){ }} {{JSON.stringify(d.value)}}  {{# } else { }} {{d.value}} {{# } }}</div>'},
                {field:'options',title:'选项',minWidth:200, templet:'<div>{{JSON.stringify(d.options)}}</div>'},
                {field:'default_value',title:'默认值',minWidth:100},
                {field:'tip',title:'提示',minWidth:200},
                {field:'sort',title:'排序',width:80,edit:'text',align:'center'},
                {field:'status',title:'状态',width:90,templet:'#statusTpl',align:'center'},
                {title:'操作',toolbar:'#tableBar',width:120}
            ]],
            page:true,
            request:{
                pageName:'page',
                limitName:'limit'
            }
        });

        // 双击编辑sort单元格事件
        table.on('edit(itemTable)',function(obj){
            let value = $.trim(obj.value);
            let row = obj.data;
            // 简单校验必须数字
            if(!/^\d+$/.test(value)){
                layer.msg('排序必须为数字',{icon:2});
                return;
            }
            $.post(UPDATE_SORT_URL, {
                id:row.id,
                sort:value
            },function(res){
                if(res.code === 0){
                    layer.msg('排序已更新',{icon:1,time:1000});
                } else {
                    layer.msg(res.msg||'更新失败',{icon:2});
                    tableIns.reload();
                }
            },'json');
        });

        // 编辑/删除配置项
        table.on('tool(itemTable)',function(obj){
            var row = obj.data;
            if(obj.event === 'edit'){
                openPopup(row);
            }else if(obj.event === 'del'){
                layer.confirm('确定删除该配置项？删除后配置数据会丢失！',function(){
                    $.post('/system_config/delete_item',{id:row.id},function(res){
                        if(res.code===0){
                            tableIns.reload();
                            layer.msg('删除成功',{icon:1});
                        }else{
                            layer.msg(res.msg,{icon:2});
                        }
                    },'json');
                })
            }
        })

        // 搜索处理
        form.on('submit(table-search)',function(data){
            var field = data.field; // 获得表单字段
            tableIns.reload({
                where:field,
                page:{curr:1}
            })
        });

        // 表格内状态switch开关切换
        form.on('switch(tableStatusSwitch)',function(obj) {
            let id = $(this).data('id');
            let status = obj.elem.checked ? 1 : 0;
            $.post(UPDATE_STATUS_URL, {id:id, status:status}, function(res){
                if(res.code !== 0){
                    layer.msg(res.msg||'状态更新失败',{icon:2});
                    tableIns.reload();
                } else {
                    layer.msg('状态已更新',{icon:1,time:1000});
                    tableIns.reload();
                }
            },'json');
        });
        
        // ===============================================
        
        // 根据配置类型渲染选项html
        function renderOptionHtml(options){
            let html = '';
            if(!options || !options.length){
                html = `<div class="layui-word-aux">暂无选项，请点击添加选项</div>`;
            }else{
                options.forEach((opt,idx)=>{
                    html += `
                    <div class="option-item">
                        <input class="layui-input opt-value" placeholder="value值" value="${opt.value??''}">
                        <input class="layui-input opt-label" placeholder="显示文本label" value="${(opt.label??'')}">
                        <button type="button" class="layui-btn layui-btn-xs layui-btn-danger del-opt">删除</button>
                    </div>`;
                })
            }
            return html;
        }

        // 数组添加kv行
        function addKvRow(container, key, value) {
            var row = '<div class="kv-row">' +
                '<input type="text" class="layui-input kv-key" placeholder="键(Key)" value="' + (key || '') + '" style="flex:1;">' +
                '<input type="text" class="layui-input kv-value" placeholder="值(Value)" value="' + (value || '') + '" style="flex:1;">' +
                '<button type="button" class="layui-btn layui-btn-sm layui-btn-danger kv-del">删除</button>' +
                '</div>';
            container.append(row);
        }
        // 数组获取kv数据
        function getKvData(container) {
            var arr = [];
            container.find('.kv-row').each(function(){
                var key = $(this).find('.kv-key').val().trim();
                var val = $(this).find('.kv-value').val().trim();
                if (key !== '') arr.push({[key]:val});
            });
            return arr;
        }

        // radio/checkbox/select配置类型获取选项数组
        function getOptionsFromDom($openLayero){
            let arr = [];
            $openLayero.find('.option-item').each(function(){
                let val = $(this).find('.opt-value').val().trim();
                let lab = $(this).find('.opt-label').val().trim();
                if(val !== '' && lab !==''){
                    arr.push({value:val, label:lab})
                }
            })
            return arr;
        }

        // 根据选择type类型动态渲染配置值html表单
        function renderValueHtml(cfgType, options, val) {

            let html = '';
            switch(cfgType) {
                case 'number':
                    return `<input  name="value" value="${val||''}" lay-verify="required|number" placeholder="请输入数字" class="layui-input">`;
                case 'text':
                    return `<input name="value" value="${val||''}" lay-verify="required" placeholder="请输入文本" class="layui-input">`;
                case 'textarea':
                    return `<textarea class="layui-textarea" name="value" rows="4">${(val||'')}${(val||'')}</textarea>`;
                case 'switch':
                    // switch类型：1勾选，0不勾选；val此时为d.value
                    const checked = String(val) === '1' ? 'checked' : '';
                    return `<input type="checkbox" name="value" lay-skin="switch" ${checked}>`;

                // ========== 以下为可选类型 radio/checkbox/select 使用 value ==========
                case 'radio':
                    options.forEach(opt=>{
                        let sel = String(opt.value) === String(val) ? 'checked' : '';
                        html += `<input type="radio" name="value" value="${opt.value}" title="${opt.label}" ${sel}>`;
                    })
                    return html;
                case 'select':
                    html += `<select name="value">`;
                    html += `<option value="">请选择</option>`;
                    options.forEach(opt=>{
                        let sel = String(opt.value) === String(val) ? 'selected' : '';
                        html += `<option value="${opt.value}" ${sel}>${opt.label}</option>`;
                    })
                    html += `</select>`;
                    return html;
                case 'checkbox':
                    let defArr = (val||'');
                    options.forEach(opt=>{
                        let chk = defArr.includes(String(opt.value)) ? 'checked' : '';
                        html += `<input type="checkbox" name="value[]" value="${opt.value}" title="${opt.label}" ${chk}>`;
                    })
                    return html;
                case 'password':
                    return `<input type="password" name="value" value="${val||''}" lay-verify="required" placeholder="请输入密码" lay-affix="eye" class="layui-input">`;
                case 'year':
                    return `<input class="layui-input def-layyear" name="value" value="${val||''}" readonly placeholder="请选择年份">`;
                case 'month':
                    return `<input class="layui-input def-laymonth" name="value" value="${val||''}" readonly placeholder="请选择月份">`;
                case 'date':
                    return `<input class="layui-input def-laydate" name="value" value="${val||''}" readonly placeholder="请选择日期">`;
                case 'time':
                    return `<input class="layui-input def-laytime" name="value" value="${val||''}" readonly placeholder="请选择时间">`;
                case 'datetime':
                    return `<input class="layui-input def-laydatetime" name="value" value="${val||''}" readonly placeholder="请选择日期时间">`;
                case 'image':
                    return `
                    <div class="image-upload-container">
                        <input name="value" class="layui-input image-input" style="width:350px;display:inline-block;" value="${val||''}" placeholder="文件URL/上传后自动填充">
                        <button type="button" class="layui-btn layui-btn-primary upload-image-btn">选择图片</button>
                    </div>`;
                case 'file':
                    return `
                    <div class="file-upload-container">
                        <input class="layui-input file-input" style="width:350px;display:inline-block;" name="value" value="${val||''}" placeholder="文件URL/上传后自动填充">
                        <button type="button" class="layui-btn layui-btn-primary upload-file-btn">选择文件</button>
                    </div>`;
                case 'phone':
                    return `<input class="layui-input"  lay-verify="required|phone" placeholder="请输入手机号"  name="value" value="${val||''}">`;
                case 'email':
                    return `<input class="layui-input"  lay-verify="required|email" placeholder="请输入邮箱"  name="value" value="${val||''}">`;
                case 'url':
                    return `<input class="layui-input"  lay-verify="required|url" placeholder="请输入URL"  name="value" value="${val||''}">`;
                case 'identity':
                    return `<input class="layui-input"  lay-verify="required|identity" placeholder="请输入身份证号"  name="value" value="${val||''}">`;
                case 'array':
                    // 键值对行，直接返回对象（非 JSON 字符串）
                    var containerId = 'value_kv_container';
                    var obj = (typeof val === 'object' && val !== null) ? val : {};
                    html += '<div class="kv-container" id="' + containerId + '">';
                    var keys = Object.keys(obj);
                    if (keys.length === 0) {
                        html += '<div class="kv-row">' +
                            '<input type="text" class="layui-input kv-key" placeholder="键(Key)" value="" style="flex:1;">' +
                            '<input type="text" class="layui-input kv-value" placeholder="值(Value)" value="" style="flex:1;">' +
                            '<button type="button" class="layui-btn layui-btn-sm layui-btn-danger kv-del">删除</button>' +
                            '</div>';
                    } else {
                        keys.forEach(function(k){
                            html += '<div class="kv-row">' +
                                '<input type="text" class="layui-input kv-key" placeholder="键(Key)" value="' + k + '" style="flex:1;">' +
                                '<input type="text" class="layui-input kv-value" placeholder="值(Value)" value="' + obj[k] + '" style="flex:1;">' +
                                '<button type="button" class="layui-btn layui-btn-sm layui-btn-danger kv-del">删除</button>' +
                                '</div>';
                        });
                    }
                    html += '</div>';
                    html += '<button type="button" class="layui-btn layui-btn-sm layui-btn-primary add-kv-row-btn">添加行</button>';
                    return html;
                default:
                    return `<input class="layui-input"  lay-verify="required" placeholder="请输入" name="value" value="${val||''}">`;
            }
        
        }

        // 弹窗表单
        function openPopup(data){
            var isEdit = !!data;
            var d = data || {group:'base',type:'text',name:'',title:'',tip:'',value:'',options:[],status:1,sort:0,default_value:''};

            var html = `
            <form class="layui-form" style="padding:15px;">
                <input type="hidden" name="id" value="${d.id||''}">
                <div class="layui-form-item">
                    <label class="layui-form-label">group 分组</label>
                    <div class="layui-input-block">
                        <input class="layui-input" name="group" value="${d.group||''}" lay-verify="required" placeholder="请输入分组" autocomplete="off">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">name 键名</label>
                    <div class="layui-input-block">
                        <input class="layui-input" name="name" value="${d.name||''}" lay-verify="required" placeholder="请输入配置键名"  ${isEdit?'readonly':''} placeholder="仅允许英文字母、数字、下划线" autocomplete="off">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">title 标题</label>
                    <div class="layui-input-block">
                        <input class="layui-input" name="title" lay-verify="required" placeholder="请输入显示标题" value="${d.title||''}" autocomplete="off">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">tip 提示</label>
                    <div class="layui-input-block">
                        <textarea class="layui-textarea" name="tip" lay-verify="required">${d.tip||''}</textarea>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">type 类型</label>
                    <div class="layui-input-block">
                        <select name="type" id="cfg_type_select" lay-filter="cfg_type" lay-verify="required">
                            <option value="number"      ${d.type==='number'?'selected':''}>number数值</option>
                            <option value="text"        ${d.type==='text'?'selected':''}>text文本</option>
                            <option value="textarea"    ${d.type==='textarea'?'selected':''}>textarea文本域</option>
                            <option value="switch"      ${d.type==='switch'?'selected':''}>switch开关</option>
                            <option value="radio"       ${d.type==='radio'?'selected':''}>radio单选</option>
                            <option value="checkbox"    ${d.type==='checkbox'?'selected':''}>checkbox多选</option>
                            <option value="select"      ${d.type==='select'?'selected':''}>select下拉</option>
                            <option value="password"    ${d.type==='password'?'selected':''}>password密码</option>
                            <option value="year"        ${d.type==='year'?'selected':''}>year年份</option>
                            <option value="month"       ${d.type==='month'?'selected':''}>month年月</option>
                            <option value="date"        ${d.type==='date'?'selected':''}>date日期</option>
                            <option value="time"        ${d.type==='time'?'selected':''}>time时间</option>
                            <option value="datetime"    ${d.type==='datetime'?'selected':''}>datetime日期时间</option>
                            <option value="image"       ${d.type==='image'?'selected':''}>image单图</option>
                            <option value="file"        ${d.type==='file'?'selected':''}>file文件</option>
                            <option value="phone"       ${d.type==='phone'?'selected':''}>phone手机号</option>
                            <option value="email"       ${d.type==='email'?'selected':''}>email邮箱</option>
                            <option value="url"         ${d.type==='url'?'selected':''}>url链接</option>
                            <option value="identity"    ${d.type==='identity'?'selected':''}>identity身份证号</option>
                            <option value="area"        ${d.type==='area'?'selected':''}>area地址</option>
                            <option value="array"       ${d.type==='array'?'selected':''}>array数组</option>
                        </select>
                    </div>
                </div>

                <!-- 选项配置外层容器 -->
                <div class="layui-form-item opt-wrap" id="option_wrap" style="display: none;">
                    <label class="layui-form-label">options 选项</label>
                    <div class="layui-input-block">
                        <!-- ✅ 所有动态生成的key‑value条目全部包裹在此容器内 -->
                        <div class="option-panel" id="option_panel">
                            <!-- js动态渲染条目在这里 -->
                            <!-- <div class="opt-item">...</div> -->
                        </div>
                        <!-- 添加按钮：放在 option_panel 外部，面板的下方 -->
                        <button type="button" class="layui-btn layui-btn-xs add-opt">+ 添加选项</button>
                    </div>
                    <div class="layui-input-block">
                        <div class="layui-word-aux">选项配置仅对radio/checkbox/select类型生效</div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">value 配置值</label>
                    <div class="layui-input-block" id="valueInputBlock">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">sort 排序</label>
                    <div class="layui-input-block">
                        <input class="layui-input" name="sort" value="${d.sort||0}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">status 状态</label>
                    <div class="layui-input-block">
                        <input type="checkbox" name="status" lay-skin="switch" value="1" ${d.status==1?'checked':''}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveItem">保存</button>
                    </div>
                </div>
            </form>
            `;
            
            // =========新增/编辑 弹窗=========
            var idx = layer.open({
                title:isEdit?'编辑配置项':'新增配置项',
                type:1,
                area:['720px','740px'],
                content: html,
                success:function(layero, index){
                    let $openLayero = layero;
                    // 配置类型选择器
                    let $typeSel = $openLayero.find('#cfg_type_select');
                    // 选项配置外层容器
                    let $optionWrap = $openLayero.find('#option_wrap');
                    // 选项面板
                    let $optionPanel = $openLayero.find('#option_panel');

                    let $valueWrap = $openLayero.find('#valueInputBlock');

                    let initOptions = d.options || [];
                    $optionPanel.html(renderOptionHtml(initOptions));

                    // 切换选项面板
                    function toggleOptionPanel(typeVal){
                        if(OPTION_TYPES.includes(typeVal)){
                            $optionWrap.show();
                        }else{
                            $optionWrap.hide();
                        }
                        refreshValueUI();
                    }

                    // 刷新配置值value UI
                    function refreshValueUI(){
                        let curType = $typeSel.val();
                        // 根据选择type类型动态渲染默认值html
                        let optArr  = getOptionsFromDom($optionPanel);
                        let curVal = d.value || '';

                        if(OPTION_TYPES.includes(curType)){
                            oldDef = d.default_value || '';
                        }else{
                            oldDef = d.value || '';
                        }

                        $valueWrap.html(renderValueHtml(curType, optArr, curVal));
                        form.render();

                        // 根据选择type类型动态渲染表单组件（如日期选择器、上传组件等）
                        switch(curType) {
                            case 'year':
                                laydate.render({ elem: '.def-layyear', type:'year' });
                                break;
                            case 'month':
                                laydate.render({ elem: '.def-laymonth', type:'month' });
                                break;
                            case 'date':
                                laydate.render({ elem: '.def-laydate', type:'date' });
                                break;
                            case 'time':
                                laydate.render({ elem: '.def-laytime', type:'time' });
                                break;
                            case 'datetime':
                                laydate.render({ elem: '.def-laydatetime', type:'datetime' });
                                break;
                            case 'image':
                                upload.render({
                                    elem: '.upload-image-btn',
                                    url: UPLOAD_URL,
                                    accept: 'images',
                                    acceptMime: 'image/*',
                                    done: function(res){
                                        if(res.code == 0){
                                            var container = $('.upload-image-btn').closest('.image-upload-container');
                                            var input = container.find('.image-input');
                                            input.val(res.data.url);
                                            layer.msg('上传成功', {icon:1});
                                        } else {
                                            layer.msg(res.msg || '上传失败', {icon:2});
                                        }
                                    },
                                    error: function(){
                                        layer.msg('上传请求失败', {icon:2});
                                    }
                                });
                                
                                break;
                            case 'file':
                                $openLayero.find('.upload-file-btn').each(function(){
                                    var container = $(this).closest('.file-upload-container');
                                    upload.render({
                                        elem: this,
                                        url: UPLOAD_URL,
                                        accept: 'file',
                                        acceptMime: 'application/*',
                                        done: function(res){
                                            if(res.code == 0){
                                                var input = container.find('.file-input');
                                                input.val(res.data.url);
                                                layer.msg('上传成功', {icon:1});
                                            } else {
                                                layer.msg(res.msg || '上传失败', {icon:2});
                                            }
                                        },
                                        error: function(){
                                            layer.msg('上传请求失败', {icon:2});
                                        }
                                    });
                                });
                                break;
                            default:
                                break;
                        }
                    }

                    toggleOptionPanel(d.type);

                    // 键值对行动态添加（array / multi_array）
                    layero.find('#valueInputBlock').on('click', '.add-kv-row-btn', function(){
                        var container = $(this).siblings('.kv-container');
                        addKvRow(container, '', '');
                        form.render();
                    });
                    layero.find('#valueInputBlock').on('click', '.kv-del', function(){
                        $(this).closest('.kv-row').remove();
                    });

                    form.on('select(cfg_type)',function(obj){
                        toggleOptionPanel(obj.value);
                    });

                    $typeSel.on('change',function(){
                        toggleOptionPanel($(this).val());
                    });

                    $openLayero.on('blur','.opt-value,.opt-label',function(){
                        refreshValueUI();
                    });

                    $openLayero.on('click','.add-opt',function(){
                        let newItemHtml = `
                        <div class="option-item">
                            <input class="layui-input opt-value" placeholder="value值" value="">
                            <input class="layui-input opt-label" placeholder="显示文本label" value="">
                            <button type="button" class="layui-btn layui-btn-xs layui-btn-danger del-opt">删除</button>
                        </div>`;
                        $optionPanel.append(newItemHtml);
                        refreshValueUI();
                    })

                    $openLayero.on('click','.del-opt',function(){
                        $(this).closest('.option-item').remove();
                        refreshValueUI();
                    })

                    // 保存配置项
                    form.on('submit(saveItem)',function(postData){
                        let field = postData.field;
                        // 处理数组类型
                        if(field.type === 'array' || field.type === 'multi_array'){
                            field.value = getKvData($openLayero.find('#valueInputBlock'));
                        }

                        console.log(field);
                        <!-- return false; -->


                        let optArr = getOptionsFromDom($optionPanel);
                        field.options = optArr;

                        const nameReg = /^[a-zA-Z0-9_]+$/;
                        if(!nameReg.test(field.name||'')){
                            layer.msg('配置键名只能为英文字母、数字、下划线',{icon:2});
                            return false;
                        }

                        //if(Array.isArray(field.default_value)){
                        //    field.default_value = field.default_value.join(',');
                        //}

                        const curType = field.type;
                        if(OPTION_TYPES.includes(curType)){
                            field.default_value = field.value;
                        } else {
                            // text / number / switch / date：default_value置空
                            field.default_value = '';
                            // 单独处理switch开关：layui提交on/无值 → 转为1/0
                            if(curType === 'switch'){
                                // 勾选时field.value === "on"，未勾选则不存在该属性
                                field.value = field.value === 'on' ? '1' : '0';
                            }
                        }

                        $.post(SAVE_ITEM_URL, field, function(res){
                            if(res.code === 0){
                                layer.close(idx);
                                tableIns.reload();
                                layer.msg('保存成功',{icon:1});
                            } else {
                                layer.msg(res.msg,{icon:2});
                            }
                        },'json');
                        return false;
                    })
                }
            });
        }

        // 添加配置项
        $('#addBtn').click(function(){
            openPopup(null);
        });

    })
</script>

{/block}
