{extend name="public/form" /}

{block name="body"}

<form class="layui-form" lay-filter="form">
	<div class="mainBox">
		<div class="main-container">

			<div class="layui-form-item">
				<label class="layui-form-label">账号</label>
				<div class="layui-input-block">
					<input type="text" name="username" disabled lay-verify="required|username" class="layui-input layui-disabled">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">电话</label>
				<div class="layui-input-block">
					<input type="text" name="mobile" lay-verify="required|phone" autocomplete="off" placeholder="请输入电话" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">邮箱</label>
				<div class="layui-input-block">
					<input type="text" name="email" lay-verify="required|email" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">密码</label>
				<div class="layui-input-block">
					<input type="password" name="password" lay-verify="" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">备注</label>
				<div class="layui-input-block">
					<textarea name="remarks" placeholder="请输入内容" class="layui-textarea"></textarea>
				</div>
			</div>
		</div>
	</div>
	
	<div class="bottom">
		<div class="button-container">
			<button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit=""
				lay-filter="user-save">
				<i class="layui-icon layui-icon-ok"></i>
				提交
			</button>
			<button type="reset" class="pear-btn pear-btn-sm">
				<i class="layui-icon layui-icon-refresh"></i>
				重置
			</button>
		</div>
	</div>
</form>

{__block__}

<script>

	const EDIT_URL = MODULE_NAME + '/system/admin/edit';
	const INFO_URL = MODULE_NAME + '/system/admin/info' + location.search;

	layui.use(['form', 'jquery'], function() {
		let form = layui.form;
		let $ = layui.jquery;

		$.get(INFO_URL, function(result) {
			if (result.code === 0) {
				form.val('form', result.data);
			}
		});

		form.on('submit(user-save)', function(data) {
			data.field.id = layui.url().search.id;
			$.ajax({
				type: 'post',
				url: EDIT_URL,
				data: data.field,
				dataType: 'json',
				success: function(result) {
					if (result.code === 0) {
						layer.msg(result.msg, {
							icon: 1,
							time: 1000
						}, function() {
							parent.layer.close(parent.layer.getFrameIndex(window.name)); //关闭当前页
							parent.layui.table.reloadData("table");
						});
					} else {
						layer.msg(result.msg, {
							icon: 2,
							time: 1000
						});
					}
				}
			})
			return false;
		});
	})
</script>

{/block}
