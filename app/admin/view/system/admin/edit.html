{extend name="public/form" /}

{block name="body"}

<form class="layui-form">
	<div class="mainBox">
		<div class="main-container">

			<div class="layui-form-item">
				<label class="layui-form-label">账号</label>
				<div class="layui-input-block">
					<input type="text" name="username" value="{$admin.username}" readonly lay-verify="required|username" autocomplete="off" placeholder="请输入用户名" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">邮箱</label>
				<div class="layui-input-block">
					<input type="text" name="email" value="{$admin.email}" lay-verify="required|email" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">密码</label>
				<div class="layui-input-block">
					<input type="text" name="password" value="" lay-verify="" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">电话</label>
				<div class="layui-input-block">
					<input type="text" name="mobile" value="{$admin.mobile}" lay-verify="required|phone" autocomplete="off" placeholder="请输入电话" class="layui-input">
				</div>
			</div>
		</div>
	</div>
	
	<div class="bottom">
		<div class="button-container">
			<button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit=""
				lay-filter="user-save">
				<i class="layui-icon layui-icon-ok"></i>
				提交
			</button>
			<button type="reset" class="pear-btn pear-btn-sm">
				<i class="layui-icon layui-icon-refresh"></i>
				重置
			</button>
		</div>
	</div>
</form>

{__block__}

<script>

	const EDIT_URL = MODULE_NAME + '/system/admin/edit';

	layui.use(['form', 'jquery'], function() {
		let form = layui.form;
		let $ = layui.jquery;

		form.on('submit(user-save)', function(data) {
			data.field.id = layui.url().search.id;
			$.ajax({
				url: EDIT_URL,
				data: data.field,
				dataType: 'json',
				type: 'post',
				success: function(result) {
					if (result.code === 0) {
						layer.msg(result.msg, {
							icon: 1,
							time: 1000
						}, function() {
							parent.layer.close(parent.layer.getFrameIndex(window.name)); //关闭当前页
							parent.layui.table.reload("table");
						});
					} else {
						layer.msg(result.msg, {
							icon: 2,
							time: 1000
						});
					}
				}
			})
			return false;
		});
	})
</script>

{/block}
