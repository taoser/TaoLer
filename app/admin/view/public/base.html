<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{block name="title"}TaoLerCMS后台管理系统{/block}</title>
  <link rel="stylesheet" href="/static/component/pear/css/pear.css" />
  <style>
    *[permission]{display: none;}
        input[type="checkbox"] {
      display: none;
    }
  </style>
  {block name="head"}{/block}
</head>
<body class="pear-container">
{block name="body"}
<script>
  const MODULE_NAME = "{$moduleName}";
</script>
<script src="/static/layui/layui.js"></script>
<script src="/static/component/pear/pear.js"></script>
<script>
  layui.use(function() {
    const URL = MODULE_NAME + '/system/admin/getRules';
    let $ = layui.$;
    $.ajax({
      url: URL,
      type: "POST",
      dataType: 'json',
      success: function(res) {
        var codes = res.data || [];
         // 细分权限
        layui.each(codes, function (k, code) {
          codes[k] = '*[permission="'+code+'"]';
        });
        
        if (codes.length) {
          $("head").append("<style>" + codes.join(",") + "{display: initial}</style>");
        }
      }
    })
  })
</script>
{/block}
</body>
</html>
