{extend name="public/base" /}

{block name="title"}插件管理{/block}

{block name="body"}

<div class="layui-card">
	<div class="layui-card-body">
		<form class="layui-form">
			<div class="layui-form-item">
				<div class="layui-form-item layui-inline">
					<label class="layui-form-label">名称</label>
					<div class="layui-input-inline">
						<input type="text" name="app_name" placeholder="插件/标题/描述/作者" class="layui-input">
					</div>
				</div>
				<div class="layui-form-item layui-inline">
					<button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="query">
						<i class="layui-icon layui-icon-search"></i>
						查询
					</button>
					<button type="reset" class="pear-btn pear-btn-md">
						<i class="layui-icon layui-icon-refresh"></i>
						重置
					</button>
				</div>
			</div>
		</form>
	</div>
</div>

<div class="layui-card">
	<div class="layui-card-body">
		<table id="plugin-list" lay-filter="plugin-list"></table>
	</div>
</div>

<script type="text/html" id="toolbar">
	<div class="pear-btn-group">
		<button class="pear-btn pear-btn-sm {{# if(layui.cache.plugin.type == 'all'){ }} pear-btn-primary {{# } }}" lay-event="all">全部</button>
		<button class="pear-btn pear-btn-sm {{# if(layui.cache.plugin.type == 'free'){ }} pear-btn-primary {{# } }}" lay-event="free">免费</button>
		<button class="pear-btn pear-btn-sm {{# if(layui.cache.plugin.type == 'installed'){ }} pear-btn-primary {{# } }}" lay-event="installed">已安装</button>
		<button class="pear-btn pear-btn-sm pear-btn-danger " lay-event="add">离线安装</button>
	</div>
</script>

<script type="text/html" id="version">
	<div>{{d.version}} {{#  if(d.have_newversion == 1) { }} <span class="layui-badge-dot"></span> {{#  } }}</div>
</script>

<script type="text/html" id="plgin-status">
	<input type="checkbox" name="{{d.name}}" lay-skin="switch" lay-filter="enable" lay-text="启动|禁用" {{#  if(d.status == 1){ }} checked {{#  } }}>
</script>

<script type="text/html" id="online-tool">

	{{#  if(d.isInstalled === 1){ }}
	
		{{#  if(d.has_new_version === 1){ }}
		<button class="pear-btn pear-btn-sm pear-btn-primary" lay-event="upgrade" title="升级">
			<i class="pear-icon pear-icon-upload"></i>
		</button>
		{{# } }}
		<button class="pear-btn pear-btn-sm pear-btn" lay-event="config" title="配置">
			<i class="pear-icon pear-icon-setting"></i>
		</button>
		
	{{# } else { }}
		<button class="pear-btn pear-btn-sm pear-btn-danger" lay-event="install" title="安装">
			<i class="pear-icon pear-icon-download"></i>
		</button>
	{{# } }}

</script>

<script type="text/html" id="installed-tool">
	<button class="pear-btn pear-btn-sm pear-btn-normal" lay-event="config" title="配置">
		<i class="layui-icon layui-icon-set"></i>
	</button>
	<button class="pear-btn pear-btn-sm pear-btn-danger" lay-event="uninstall" title="卸载">
		<i class="layui-icon layui-icon-delete"></i>
	</button>
</script>

{include file="public/user_login" /}

{__block__}

<script>

	// 插件列表
	const LIST_URL = MODULE_NAME + '/soft/plugin/list';
	// 启用插件
	const ENABLE_URL = MODULE_NAME + '/soft/plugin/enable';
	// 检查插件是否已安装
	const CHECK_URL = MODULE_NAME + '/soft/plugin/check';

	// 安装插件
	const INSTALL_URL = MODULE_NAME + '/soft/plugin/install';
	// 升级插件
	const UPGRADE_URL = MODULE_NAME + '/soft/plugin/upgrade';
	// 卸载插件
	const UNINSTALL_URL = MODULE_NAME + '/soft/plugin/uninstall';
	// 配置插件
	const CONFIG_URL = MODULE_NAME + '/soft/plugin/config';
	// 配置插件设置
	const CONFIG_SET_URL = MODULE_NAME + '/soft/plugin/configSet';
	// 用户登录
	const USER_LOGIN_URL = MODULE_NAME + '/user/user/userLogin';
	// 支付
	const PAY_URL = MODULE_NAME + '/soft/plugin/pay';
	// 是否支付
	const IS_PAY_URL = MODULE_NAME + '/soft/plugin/isPay';

	const ADD_URL = MODULE_NAME + '/soft/plugin/add';

	layui.use(['toast','plugin'], function(){
		var $ = layui.jquery
		,table = layui.table
		,form = layui.form
		,upload = layui.upload;
		var toast = layui.toast;

		// 点击按钮缓存类型
		layui.cache.plugin = {
			type: 'all'
		}
		
		let cols = [[
			{title: '序号', type: 'numbers'},
			{field: 'name', title: '插件', width: 150,},
			{field: 'version', title: '版本', templet: '#version', width: 75},
			{title: '简介', minWidth: 200, templet: '<div>【{{= d.title}}】 - {{= d.description}}</div>'},
			{field: 'price', title: '价格(元)', width: 85},
			{field: 'author', title: '作者', width: 100},
			{field: 'down_num', title: '下载', width: 70, align:'center'},
			{title: '操作', width: 120, templet: '#online-tool', align: 'center'}
		]];
		
		let localCols  = [[
			{type: 'checkbox'},
			{title: '序号', type: 'numbers'},
			{field: 'name', title: '插件', width:  120},
			{field: 'version', title: '版本', width: 75},
			{title: '简介', minWidth: 200, templet: '<div>【{{= d.title}}】 - {{= d.description}}</div>'},
			{field: 'author', title: '作者', width:  80},
			{field: 'install', title: '安装', width: 100, align:'center'},
			{field: 'ctime', title: '到期时间', width: 100},
			{title: '状态', width:  95, templet: '#plgin-status'},
			{title: '操作', width: 120, 'align': 'center', templet:  '#installed-tool'}
		]];

		//渲染表格
		var addonTable = table.render({
			elem: "#plugin-list",
			url: LIST_URL,
			page: true,
			cols: cols,
			skin: 'line',
			toolbar: "#toolbar",
			limit: 15,
			text: "对不起，加载出现异常！"
		});

		table.on('toolbar(plugin-list)', function(obj){
			type = obj.event;
			layui.cache.plugin.type = type;
			if(obj.event === 'installed') {				
				window.installed(obj.event);
			} else if(obj.event === 'add'){
				window.add();
			} else {
				// all,free,pay
				window.all(obj.event);
			}
		});

		// 全部/免费/付费
		window.all = function (type) {
			// 重新渲染
			table.reload('plugin-list',{
				where: {
					type : type
				},
				cols: cols,
				page: {
					curr: 1 //重新从第 1 页开始
				}
			});
		}

		// 已安装
		window.installed = function (type) {
			table.reload('plugin-list', {
				where: {
					type : type
				},
				cols: localCols,
				page: {
					curr: 1 
				}
			});
		}

		window.add = function(){
			layer.alert('离线插件添加功能暂未开放');
			return false;
			
			layer.open({
				type: 2
				,title: '添加插件'
				,content: 'add.html'
				,area: ['400px', '300px']
			});
		}

		form.render('select'); // 渲染所在容器内的 select 元素

		//监听版本选择
		form.on('select(versSelect)', function(obj){
			layer.tips(this.value + ' ' + this.name + '：'+ obj.elem.checked, obj.othis);
		});

		form.on('submit(query)', function(data) {
			var type = layui.cache.plugin.type;
			table.reload('plugin-list', {
				where: {app_name: data.field.app_name, type: type, page: 1}
			})
			return false;
		});

		// 启动禁用
		form.on('switch(enable)', function(data){
			var data = data.elem;
			$.post(CHECK_URL, { name: data.name }, function(res){
				if(res.code === 0){
					toast.success({title:"成功消息",message:res.msg,position: 'topRight'});
				} else {
					toast.error({title:"失败消息",message:res.msg,position: 'topRight'});
				}
				table.reloadData("plugin-list", {}, 'deep');
			})
			return false;
		});

	})
</script>

{/block}
