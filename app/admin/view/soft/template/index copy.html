{extend name="public/base" /}

{block name="title"}模板{/block}

{block name="body"}

<div class="layui-card">
	<div class="layui-card-body">
		<form class="layui-form layui-form-pane">
		
		

			<div class="layui-form-item">
				<label class="layui-form-label">卡片标题</label>
				<div class="layui-input-inline">
					<input type="text" name="realName" id="realName" placeholder="" class="layui-input">
				</div>
				<div class="layui-inline">
					<button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn"><i class="layui-icon">&#xe615;</i>
						搜 索
					</button>
				</div>
				<div class="layui-btn-group layui-inline">
					<button type="button" class="layui-btn layui-btn-primary" lay-on="all">
						全部
					</button>
					<button type="button" class="layui-btn layui-btn-primary" lay-on="free">
						<i class="layui-icon layui-icon-add-1">免费</i>
					</button>
					<button type="button" class="layui-btn layui-btn-primary" lay-on="installed">
						<i class="layui-icon layui-icon-edit">已安装</i>
					</button>
					<button type="button" class="layui-btn layui-btn-primary" lay-on="import">
						<i class="layui-icon layui-icon-delete">导入</i>
					</button>
				</div>
			</div>
		</form>
	</div>
</div>

<div class="layui-card">
	<div class="layui-card-body">
		<div class="layui-row layui-col-space30" id="tplId">
		</div>
	</div>
</div>

<div class="layui-card">
	<div class="layui-card-body">
		<div class="layui-row layui-col-space30" id="templateTableId">
		</div>
	</div>
</div>

{__block__}

<script>
const TEMPLATE_LIST = MODULE_NAME + '/soft/template/list';
const INSTALL_URL = MODULE_NAME + '/soft/template/install';
const ENABLE_URL = MODULE_NAME + '/soft/template/enable';
const DELETE_URL = MODULE_NAME + '/soft/template/delete';
const UPDATE_URL = MODULE_NAME + '/soft/template/update';

layui.use(['jquery','toast','loading'], function() {

	let table = layui.table;
	let form = layui.form;
	let $ = layui.jquery;
	let layer = layui.layer;
	
	let util = layui.util;
	let toast = layui.toast;
	let loading = layui.loading;


	var tpl = {
  render: function (obj) {
    const self = this;
    // 缓存完整原始配置
    self.cacheOpt = { ...obj };

    self.elem = obj.elem;
    self.url = obj.url;
    self.data = obj.data || {};
    self.page = obj.page || false;
    self.limit = obj.limit || 10;
	self.height = obj.height || 100;

    self.renderList = function (datas) {
      const container = $(self.elem);
      container.empty();

      $.each(datas, function (index, vo) {
        let html = `
        <div class="layui-col-md3 layui-col-xs6 ew-datagrid-item">
          <div class="project-list-item">
            <img class="project-list-item-cover" src="${vo.thum_img || ''}">
            <div class="project-list-item-body">
              <h2 class="layui-elip">${vo.name || ''}</h2>
              <div class="project-list-item-text">${vo.ver_desc || ''}</div>
              <div class="project-list-item-desc">
                <span class="time">版本:${vo.version || ''}</span>
                <div class="ew-head-list">
                  <span class="time">${vo.time || ''}</span>
                </div>
              </div>
              <div class="project-list-item-desc" style="margin-top: 15px;">
                <div class="layui-btn-group">`;

        if (vo.enable) {
          html += `<button type="button" class="layui-btn layui-btn-sm layui-btn-primary">使用中</button>`;
        } else {
          if (!vo.installed) {
            html += `<button type="button" lay-on="install" data-name="${vo.name}" class="layui-btn layui-bg-blue layui-btn-sm">安装</button>`;
          } else {
            html += `<button type="button" lay-on="enable" data-name="${vo.name}" class="layui-btn layui-btn-sm">启用</button>`;
            html += `<button type="button" lay-on="delete" data-name="${vo.name}" class="layui-btn layui-btn-sm layui-btn-danger">删除</button>`;
          }
        }

        html += `</div>`;

        if (vo.update) {
          html += `
          <div class="ew-head-list">
            <button type="button" lay-on="update" data-name="${vo.name}" class="layui-btn layui-btn-sm layui-bg-orange">更新</button>
          </div>`;
        }

        html += `
              </div>
            </div>
          </div>
        </div>`;
        container.append(html);
      });
    };

    self.fetchData(obj);
  },

  reload: function (p1, p2) {
    const self = this;
    if (!self.cacheOpt) {
      console.warn('请先执行tpl.render初始化列表');
      return;
    }

    // 重置临时变量
    let targetElem = null;
    let newQuery = null;

    // 多参数兼容逻辑
    if (typeof p1 === 'string') {
      // 第一种：第一个参数是容器ID字符串
      targetElem = '#' + p1;
      newQuery = p2 && typeof p2 === 'object' ? p2 : null;
    } else if (p1 && typeof p1 === 'object') {
      // 第二种：只传查询对象
      newQuery = p1;
      targetElem = null;
    }

    // 如果指定了新容器，更新elem
    if (targetElem) {
      self.elem = targetElem;
      self.cacheOpt.elem = targetElem;
    }

    // 合并查询参数
    if (newQuery && newQuery.where) {
      self.cacheOpt.data = { ...self.cacheOpt.data, ...newQuery.where };
      self.data = self.cacheOpt.data;
    }

    // 发起请求刷新
    self.fetchData(self.cacheOpt);
  },

  fetchData: function (obj) {
    const self = this;
    if (self.page) {
      self.data.page = obj.data.page || 1;
      self.data.limit = self.limit;
    }
    $.get(TEMPLATE_LIST, self.data, function (res) {
      if (res.code === 0 && res.data.length > 0) {
        self.renderList(res.data);
      } else {
        $(self.elem).html('<div style="padding:20px;text-align:center;color:#999;">暂无数据</div>')
      }
    });
  }
};
	// 渲染
	tpl.render({
		elem: '#tplId',
		url: TEMPLATE_LIST, // 接口
		page: true, // 开启分页
		data: {id:1, page:2, limit:10} // 初始查询参数
	});

	// 重载列表
	tpl.reload({
		where:{
			page:1
		},
		height:400,
	})


	var queryJson = function(where) {
		$.get(TEMPLATE_LIST, where, function(res){
			if(res.code === 0 && res.data.length > 0){
				console.log(res.data);
				renderProjectList(res.data);
			}
		})
	};

	queryJson({});

	// 2. 核心渲染方法
	function renderProjectList(list){
		const container = $('#templateTableId');
		container.empty(); // 清空容器

		// 循环数据
		$.each(list, function(index, vo){
			// 拼接HTML（完全还原你给的结构 + 条件判断）
			let html = `
			<div class="layui-col-md3 layui-col-xs6 ew-datagrid-item">
				<div class="project-list-item">
					<img class="project-list-item-cover" src="${vo.thum_img || ''}">
					<div class="project-list-item-body">
						<h2 class="layui-elip">${vo.name || ''}</h2>
						<div class="project-list-item-text ">${vo.ver_desc || ''}</div>
						<div class="project-list-item-desc">
							<span class="time">版本:${vo.version || ''}</span>
							<div class="ew-head-list">
								<span class="time">${vo.time || ''}</span>
							</div>
						</div>
						<div class="project-list-item-desc" style="margin-top: 15px;">
							<div class="layui-btn-group">`;
								// 条件1：未本地安装 → 显示安装
								if(!vo.installed){
									html += `<button type="button" lay-on="install" data-name="${vo.name}" theme="default" class="enable layui-btn layui-bg-blue layui-btn-sm">安装</button>`;
								}

								// 条件2：已本地安装 + 未启用 → 显示启用
								if(vo.installed && !vo.enable){
									html += `<button type="button" lay-on="enable" data-name="${vo.name}" theme="default" class="enable layui-btn layui-btn-sm">启用</button>`;
								}

								// 条件3：未启用 + 已本地安装 → 显示删除
								if(!vo.enable && vo.installed){
									html += `<button type="button" lay-on="delete" data-name="${vo.name}" theme="default" class="enable layui-btn layui-btn-sm layui-btn-danger">删除</button>`;
								}

								// 条件4：已启用 → 显示使用中
								if(vo.enable){
									html += `<button type="button" theme="default" class="layui-btn layui-btn-sm layui-btn-primary">使用中</button>`;
								}
					html += `</div>`;

							// 条件5：有更新 → 显示更新按钮
							if(vo.update){
								html += `
									<div class="ew-head-list">
										<button type="button" lay-on="update" data-name="${vo.name}" theme="default" class="enable layui-btn layui-btn-sm layui-bg-orange">更新</button>
									</div>
								`;
							}

				html += `</div>
					</div>
				</div>
			</div>`;

			// 追加到容器
			container.append(html);
		});
	}

	// HTML 转义
	util.on({
		install: function() {
			var name = $(this).attr('data-name');
			loading.Load(4, "安装模板");
			$.post("{:url('addon.template/install')}", {name}, function(res) {
				loading.loadRemove(1000);
				if(res.code === 1) {
					toast.success({title:"成功消息",message:res.msg})
					window.location.reload();
				} else {
					toast.error({title:"危险消息",message:res.msg})
				}
			})
			return false;
		},
		enable: function() {
			var name = $(this).attr('data-name');
			loading.Load(5, "启用模板");
			$.post("{:url('addon.template/enable')}", {name}, function(res) {
				loading.loadRemove(1000);
				if(res.code === 1) {
					toast.success({title:"成功消息",message:res.msg})
					window.location.reload();
				} else {
					toast.error({title:"危险消息",message:res.msg})
				}
			})
			
			return false;
		},
		delete: function() {
			var name = $(this).attr('data-name');
			layer.confirm('确定要删除?', {
				icon: 3,
				title: '提示'
			}, function(index) {
				layer.close(index);
				loading.Load(2, "删除模板");
				$.post("{:url('addon.template/delete')}", {name}, function(res) {
					loading.loadRemove(1000);
					if(res.code === 1) {
						toast.success({title:"成功消息",message:res.msg})
						window.location.reload();
					} else {
						toast.error({title:"危险消息",message:res.msg})
					}
				})
			});
			
			return false;
		},
		update: function(){
			var name = $(this).attr('data-name');
			loading.Load(3,message);
			$.post("{:url('addon.template/update')}", {name}, function(res) {
				loading.loadRemove(1000);
				if(res.code === 1) {
					toast.success({title:"成功消息",message:res.msg})
					// window.location.reload();
				} else {
					toast.error({title:"危险消息",message:res.msg})
				}
			})
			return false;
		},
		all: function(){
			card.reload("currentTableId", {
				where: queryJson,
			});
		},
		free: function(){
			card.reload("currentTableId", {
				where: queryJson,
				free: 1,
			});
		},
		installed: function(){
			card.reload("currentTableId", {
				where: queryJson,
				installed: 1,
			});
		},
		import: function(){
			card.reload("currentTableId", {
				where: queryJson,
				import: 1,
			});
		},
	});
	
	// 监听搜索操作
	form.on('submit(data-search-btn---)', function(data) {
		queryJson = data.field;
		card.reload("currentTableId", {
			where: queryJson,
		});
		return false;
	});

	form.on('submit(data-checked-btn---)', function() {
		var data = card.getChecked("currentTableId");
		layer.msg(JSON.stringify(data));
		return false;
	});

	form.on('submit(data-btn---)', function() {
		var data = card.getAllData("currentTableId");
		layer.msg(JSON.stringify(data));
		return false;
	});
})
</script>

<script>
		var queryJson = function(where) {
		$.get(TEMPLATE_LIST, where, function(res){
			if(res.code === 0 && res.data.length > 0){
				console.log(res.data);
				renderProjectList(res.data);
			}
		})
	};

	// queryJson({});

		container.empty(); // 清空容器

		// 循环数据
		$.each(list, function(index, vo){
			// 拼接HTML（完全还原你给的结构 + 条件判断）
			let html = `

							</div>
						</div>
						<div class="project-list-item-desc" style="margin-top: 15px;">

								if(!vo.installed){

								}

								if(!vo.enable && vo.installed){
									html += `<button type="button" lay-on="delete" data-name="${vo.name}" theme="default" class="enable layui-btn layui-btn-sm layui-btn-danger">删除</button>`;

								if(vo.enable){
									html += `<button type="button" theme="default" class="layui-btn layui-btn-sm layui-btn-primary">使用中</button>`;

					html += `</div>`;

							// 条件5：有更新 → 显示更新按钮
							if(vo.update){
								html += `
									<div class="ew-head-list">
										<button type="button" lay-on="update" data-name="${vo.name}" theme="default" class="enable layui-btn layui-btn-sm layui-bg-orange">更新</button>
									</div>
								`;
							}

				html += `</div>
					</div>
				</div>
			</div>`;

			// 追加到容器
			container.append(html);
		});
	}
</script>

{/block}
