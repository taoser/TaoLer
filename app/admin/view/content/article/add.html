{extend name="public:form" /}

{block name="link"}
<style>
	.form-panel{padding: 10px;}
	#L_title {position: relative;}
	.bdsug {height: auto; position: absolute; left: 0; top: 30px; z-index: 100; background: #fff; border-radius: 0 0 10px 10px; border: 1px solid #dadade!important; border-top: 0!important; box-shadow: none;}
	.bdsug ul{display: block;margin: 5px 2px 0; padding: 5px 0 7px; background: 0 0; border-top: 0px solid #f5f5f6;}
	.bdsug ul>li{margin-top: 0;height:30px;line-height: 25px;}
</style>
{/block}

{block name="body"}

<form class="layui-form form-panel">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md9">
			<div class="layui-form-item">
				<input type="text" id="L_title" name="title" lay-verify="required" placeholder="{:lang('please input the title')}" required autocomplete="off" class="layui-input" style="position:relative;"/>
			</div>
			<div class="layui-form-item layui-form-text">
				<textarea id="L_content" name="content" lay-verify="" placeholder="{:lang('please input the content')}" class="layui-textarea taonyeditor"></textarea>
			</div>
		</div>

		<div class="layui-col-md3">
			<div class="layui-form-item">
				<div id="cate-id" class="xm-select-demo"></div>
			</div>
			<div class="layui-form-item">
				<textarea name="description" class="layui-textarea" placeholder="{:lang('please input the description')}"></textarea>
			</div>
			{//关键词}
			<div class="layui-form-item">
				<!-- <input type="text" class="layui-input" name="" id="inputTags"  value="" placeholder="多个回车添加" title="添加关键词" /> -->
				<input type="text" class="layui-input" name="keywords" value="" placeholder="多个用逗号隔开" title="关键词" />
			</div>
			{//tag}
			<div class="layui-form-item">
				<div id="tag"></div>
			</div>
			<div class="layui-form-item">
				<div class="button-container">
					<button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit="" lay-filter="form-save">
						<i class="layui-icon layui-icon-ok"></i>{:lang('submit')}
					</button>
					<button type="reset" class="pear-btn pear-btn-sm">
						<i class="layui-icon layui-icon-refresh"></i>{:lang('reset')}
					</button>
				</div>
			</div>
		</div>
	</div>

</form>

{__block__}

<script>

	const ADD_ARTICLE = MODULE_NAME + '/content/article/add';
	const GET_CATEGORY_TREE = MODULE_NAME + '/content/category/getArticleSelectCategoryList';
	const GET_TAG_TREE = MODULE_NAME + '/content/tag/tree';
	const UPLOAD_URL = MODULE_NAME + '/content/article/uploads';

	layui.use(['xmSelect','popup'], function () {
		var $ = layui.jquery, form = layui.form, upload = layui.upload;
		var xmSelect = layui.xmSelect;
		let popup = layui.popup;

		// 分类选择 渲染下拉树
		$.get(GET_CATEGORY_TREE, function(res){
			xmSelect.render({
				el: '#cate-id',
				name: 'category_id',
				height: '250px',
				layVerify: 'required',
				layVerType: 'tips',
				data: res.data,
				initValue:  [],
				model: {label: {type: 'text'}},
				prop: {
					name: 'name',
					value: 'id'
				},
				// radio: true,
				clickClose: true,
				tree: {
					show: false,
					indent: 15,
					strict: false,
					expandedKeys: false
				},
				on: function(data){ // 单选on模式
					if(data.isAdd){
						return data.change.slice(0, 1)
					}
				},
				tips: '{:lang("please select the category")}'
			});
		});

		//2.动态标签赋值
		$.get(GET_TAG_TREE, function(res){
			if(res.code === 0){
				xmSelect.render({
					el: '#tag',
					name: 'tagid',
					layVerify: '',
					layVerType: 'msg',
					paging: true,
					pageSize: 10,
					filterable: true,
					pageEmptyShow: false,
					data: res.data,
					autoRow: true,
					tips: '{:lang("please select the tag")}'
				});
			}
		});

		// 上传附件
		upload.render({
			elem: "#zip-button",
			url: UPLOAD_URL, //改成您自己的上传接口
			data: { type: "zip" },
			accept: "file",
			before: function(obj){
				layer.load();
			},
			done: function (res) {
				layer.closeAll('loading');
				if (res.status === 0) {
					$('input[name="upzip"]').val(res.url);
					layer.msg("上传成功");
				} else {
					layer.msg(res.msg);
				}
			},
		});

		// 保存
		form.on('submit(form-save)', function(data) {
			var field = data.field;
			console.log(field);
			$.ajax({
				url: ADD_ARTICLE,
				data: field,
				dataType: 'json',
				type: 'post',
				success: function(res) {
					if(res.code) {
						return popup.failure(res.msg);
					}
					return popup.success(res.msg, function() {
						parent.layui.table.reload("table");
						parent.layer.close(parent.layer.getFrameIndex(window.name)); //关闭当前页
						
					});
				}
			})
			return false;
		});

	});
</script>

{// 编辑器}
{:hook('ueditor')}
{:hook('taonyeditor')}


{/block}
