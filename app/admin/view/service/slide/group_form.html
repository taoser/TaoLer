{extend name="public/form" /}

{block name="body"}
<form class="layui-form" lay-filter="formGroup">
    <input type="hidden" name="id" value="{$info.id??0}">
    <div class="layui-form-item">
    <label class="layui-form-label">分组名称</label>
    <div class="layui-input-block">
    <input type="text" name="name" value="{$info.name??''}" class="layui-input" lay-verify="required">
    </div>
    </div>
    <div class="layui-form-item">
    <label class="layui-form-label">调用标识</label>
    <div class="layui-input-block">
    <input type="text" name="code" value="{$info.code??''}" class="layui-input" lay-verify="required">
    <div class="layui-form-mid layui-word-aux">英文标识，前端调用使用，不可重复</div>
    </div>
    </div>
    <div class="layui-form-item">
    <label class="layui-form-label">备注</label>
    <div class="layui-input-block">
    <textarea name="remark" class="layui-textarea">{$info.remark??''}</textarea>
    </div>
    </div>
    <div class="layui-form-item">
    <div class="layui-input-block">
    <button class="layui-btn" lay-submit lay-filter="submitGroup">保存</button>
    </div>
    </div>
</form>

{__block__}

<script>

    const GROUP_SAVE = MODULE_NAME + '/service/slide/groupSave';

    layui.use(['form'],function(){
        var $ = layui.jquery;
        var form = layui.form;
        form.on('submit(submitGroup)',function(data){
            $.post(GROUP_SAVE,data.field,function(res){
                if(res.code===0){
                    layer.msg('保存成功',{time:1000},function(){
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                    })
                }else{
                    layer.msg(res.msg);
                }
            },'json');
            return false;
        })
    })
</script>
{/block}
