{extend name="public/base" /}

{block name="title"}幻灯管理（分组+子项同页 | datetime）{/block}

{block name="body"}

<div class="layui-btn-group">
    <button class="layui-btn layui-btn-sm" id="addGroup">新增幻灯分组</button>
</div>

<table id="tableGroup" lay-filter="tableGroup"></table>

<!-- 分组操作：添加子项、查看子项、编辑、删除 -->
<script type="text/html" id="barGroup">
<a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="addChild">添加子项</a>
<a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="viewChild">查看子项</a>
<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑分组</a>
<a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除分组</a>
</script>

<!-- 子项表格工具栏模板 -->
<script type="text/html" id="barItem">
<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="editItem">编辑</a>
<a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delItem">删除</a>
</script>

{__block__}

<script>
    const GROUP_DATA = MODULE_NAME + '/service/slide/groupData';
    const ITEM_DATA = MODULE_NAME + '/service/slide/itemData';
    const GROUP_FORM = MODULE_NAME + '/service/slide/groupForm';
    const ITEM_FORM = MODULE_NAME + '/service/slide/itemForm';
    const GROUP_DEL = MODULE_NAME + '/service/slide/groupDel';
    const ITEM_DEL = MODULE_NAME + '/service/slide/itemDel';

layui.use(['table','layer','jquery'],function(){
    var table = layui.table;
    var layer = layui.layer;
    var $ = layui.jquery;
    var tableIns;

    tableIns = table.render({
        elem:'#tableGroup',
        url:GROUP_DATA,
        page:true,
        cols:[[
            // 移除 {type:'expand'} !!! layui2.13.9不支持
            {field:'id',title:'ID',width:60},
            {field:'name',title:'分组名称'},
            {field:'code',title:'调用标识'},
            {field:'remark',title:'备注'},
            {field:'create_time',title:'创建时间'},
            {title:'操作',toolbar:'#barGroup',width:380}
        ]]
    });

    //主表格工具栏事件
    table.on('tool(tableGroup)',function(obj){
        var data = obj.data;
        if(obj.event === 'addChild'){
            // 添加幻灯子项弹窗
            layer.open({
                type:2,
                title:'新增幻灯子项【'+data.name+'】',
                area:['700px','550px'],
                content: ITEM_FORM +'?group_id=' + data.id,
            })
        }else if(obj.event === 'viewChild'){
            // 查看子项，弹窗内渲染子表格，子表无分页
            var childLayerIndex = layer.open({
                type:1,
                title:'幻灯子项列表【'+data.name+'】',
                area:['900px','600px'],
                content:'<div style="padding:15px;"><table id="childTable-'+data.id+'" lay-filter="childTable-'+data.id+'"></table></div>'
            });
            // 渲染子表格
            setTimeout(function(){
                table.render({
                    elem:'#childTable-'+data.id,
                    url:ITEM_DATA+'?group_id='+data.id,
                    page:false, //子项不开启分页
                    cols:[[
                        {field:'id',title:'ID',width:60},
                        {field:'title',title:'标题'},
                        {field:'image',title:'图片',templet:function(d){
                            return '<img src="'+d.image+'" style="height:40px;">';
                        }},
                        {field:'start_time',title:'开始时间'},
                        {field:'end_time',title:'结束时间'},
                        {field:'status',title:'状态',templet:function(d){
                            return d.status===1 ? '<span class="layui-green">启用</span>' : '<span class="layui-red">禁用</span>';
                        }},
                        {field:'sort',title:'排序',width:80},
                        {title:'操作',toolbar:'#barItem',width:160}
                    ]]
                })
            },100);
        }else if(obj.event === 'edit'){
            layer.open({
                type:2,title:'编辑分组',area:['500px','320px'],
                content:GROUP_FORM+'?id='+data.id,
                end:function(){tableIns.reload();}
            })
        }else if(obj.event === 'del'){
            layer.confirm('确定删除该分组？分组下所有幻灯子项将会同步删除！',function(){
                $.post(GROUP_DEL,{id:data.id},function(res){
                    if(res.code===0){
                        layer.msg(res.msg);
                        tableIns.reload();
                    }else {
                        layer.msg(res.msg);
                    }
                },'json');
            })
        }
    })

    //子表格编辑删除事件
    table.on('tool(*)',function(obj){
        var filter = obj.config.layFilter;
        if(filter.indexOf('childTable-') === 0){
            var d = obj.data;
            if(obj.event === 'editItem'){
                layer.open({
                    type:2,title:'编辑幻灯子项',area:['700px','550px'],
                    content:ITEM_FORM+'?id='+d.id,
                    end:function(){
                        table.reload(filter);
                    }
                })
            }else if(obj.event === 'delItem'){
                layer.confirm('确定删除这条幻灯？',function(){
                    $.post(ITEM_DEL,{id:d.id},function(res){
                        if(res.code===0){
                            layer.msg('删除成功');
                            table.reload(filter);
                        }else{
                            layer.msg(res.msg);
                        }
                    },'json');
                })
            }
        }
    })

    //新增分组
    $('#addGroup').on('click',function(){
        layer.open({
            type:2,
            title:'新增幻灯分组',
            area:['500px','320px'],
            content:GROUP_FORM,
            end:function(){tableIns.reload();}
        })
    })
})
</script>
{/block}
