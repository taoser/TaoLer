{extend name="public/form" /}

{block name="body"}

<form class="layui-form" lay-filter="form">
		<div class="mainBox">
		<div class="main-container">
			<div class="layui-form-item">
				<label class="layui-form-label">父模块</label>
				<div class="layui-input-block">
					<select name="section_id" lay-filter="section">
						{foreach name="section" id="vo"}
						<option value="{$vo.id}">{$vo.title}</option>
						{/foreach}
					</select>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">标题</label>
				<div class="layui-input-block">
					<input type="text" name="name" lay-verify="required" placeholder="标题" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">icon</label>
				<div class="layui-input-block">
					<input type="text" name="icon" lay-verify="" placeholder="图标icon" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item" id="img">
				<label class="layui-form-label">图片</label>
				<div class="layui-input-inline">
					<input type="text" name="image" lay-verify="" placeholder="上传图片" autocomplete="off" lay-filter="iconPicker" class="layui-input">
				</div>
				<button style="float: left;" type="button" class="layui-btn" id="upload-section-img">选图</button>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">URL</label>
				<div class="layui-input-block">
					<input type="text" name="url" lay-verify="url" placeholder="{:lang('please input the url')}" autocomplete="off" class="layui-input" >
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">描述</label>
				<div class="layui-input-block">
					<textarea type="text" name="description" lay-verify="" placeholder="描述*" autocomplete="off" class="layui-textarea"></textarea>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">option</label>
				<div class="layui-input-block">
					<textarea type="text" name="option" lay-verify="" placeholder="请输入JSON格式" autocomplete="off" class="layui-textarea"></textarea>
					<div class="form-tip">用于额外参数设置，例如：<code>{"button":"查看详情","css":"put-left"}</code></div>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">排序</label>
				<div class="layui-input-block">
					<input type="text" name="sort" lay-verify="number" placeholder="请填数字" autocomplete="off" class="layui-input">
				</div>
			</div>
		</div>
	</div>
	<div class="bottom">
		<div class="button-container">
			<button type="submit" class="pear-btn pear-btn-primary pear-btn-sm" lay-submit="" lay-filter="cate-save">
				<i class="layui-icon layui-icon-ok"></i>
				提交
			</button>
			<button type="reset" class="pear-btn pear-btn-sm">
				<i class="layui-icon layui-icon-refresh"></i>
				重置
			</button>
		</div>
	</div>
</form>

{__block__}

<script>
	const ADD_EDIT = MODULE_NAME + '/service/section/editSub';
	const UPLOAD_URL = MODULE_NAME + '/service/section/uploadImg';
	const INFO_URL = MODULE_NAME + '/service/section/info' + location.search;

	layui.use(['imgcom','popup'],function(){
		var $ = layui.jquery
		,form = layui.form ;
		var upload = layui.upload;
		var imgcom = layui.imgcom;
		let popup = layui.popup;

		$.get(INFO_URL, function(res){
			if(res.code === 0) {
				form.val('form', res.data);
			}
		})

		form.on('submit(cate-save)', function(data) {
			data.field.id = layui.url().search.id;
			$.ajax({
				url: ADD_EDIT,
				data: data.field,
				dataType: 'json',
				type: 'post',
				success: function(res) {

					if(res.code) {
						return popup.failure(res.msg);
					}
					return popup.success(res.msg, function() {
						// parent.layui.table.reload("section-table");
							parent.layer.close(parent.layer.getFrameIndex(window.name)); //关闭当前页
							window.parent.location.reload();
					});
				},
				error:function(e) {
					return popup.failure(e.responseJSON.msg);
				}
			})
			return false;
		});

		//上传图片
		upload.render({
		elem: '#upload-section-img'
		,url: UPLOAD_URL
		,data:{type:'image'}
		,accept: 'images'
		,acceptMime: 'image/*'
		,auto: false
		,choose: function (obj) { //选择文件后的回调
				imgcom.uploads(obj);
			}
		,done: function(res){
			$(this.item).prev("div").children("input").val(res.src)
			if(res.code === 0){
				layer.msg(res.msg,{icon:6,tiye:2000});
			} else {
				layer.open({title:"上传失败",content:res.msg,icon:5,anim:6});
			}
		}
		});

	})
</script>

{/block}
