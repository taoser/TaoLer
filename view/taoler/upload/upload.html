<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Layui upload 多文件分片上传 修复版</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui-src/dist/css/layui.css">
  <style>
    .upload-box {width:720px;margin:30px auto;}
    .file-item {border:1px solid #eee;padding:12px;margin:10px 0;border-radius:4px;}
    .file-name {font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;}
    .layui-progress {margin:8px 0;}
    .tip-text {font-size:13px;color:#666;}
  </style>
</head>
<body>
<div class="upload-box">
  <div class="layui-card">
    <div class="layui-card-header">大文件分片上传（layui.upload 组件）</div>
    <div class="layui-card-body">
      <button class="layui-btn" id="uploadBtn">选择多个文件</button>
      <div id="uploadList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui-src/dist/layui.js"></script>
<script>
layui.use(['upload', 'jquery', 'layer'], function(){
  const upload = layui.upload;
  const $ = layui.jquery;
  const layer = layui.layer;

  const chunkSize = 2 * 1024 * 1024;
  const maxTotalSize = 10 * 1024 * 1024 * 1024;
  const allowExt = ['mp4','avi','mov','zip','rar','7z','pdf','jpg','jpeg','png','gif'];
  const maxConcurrent = 3;
  let uploadQueue = [];
  let runningCount = 0;

  const uploadInst = upload.render({
    elem: '#uploadBtn',
    url: '/upload/chunk',
    multiple: true,
    auto: false,
    'accept': 'file',
    choose: function(obj){
      // 先判断是否存在文件列表，避免null/undefined报错
      if (!obj || !obj.files) return;
      const fileList = obj.files;

      // 安全遍历 FileList，不用slice.call/Array.from，杜绝类型转换报错
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        if(!checkFileSafe(file)) continue;

        const fileId = Date.now() + '_' + Math.random().toString(36).slice(2);
        const domId = `file_${fileId}`;
        const html = `
          <div class="file-item" id="${domId}">
            <div class="file-name">
              <span>${file.name}</span>
              <span class="layui-text-desc">${formatSize(file.size)}</span>
            </div>
            <div class="layui-progress">
              <div class="layui-progress-bar" lay-percent="0%"></div>
            </div>
            <div class="tip-text">等待排队上传...</div>
          </div>
        `;
        $('#uploadList').append(html);
        uploadQueue.push({file, fileId, domId});
      }
      runUploadQueue();
    }
  });

  // 并发队列调度
  function runUploadQueue(){
    if(runningCount >= maxConcurrent || uploadQueue.length === 0) return;
    runningCount++;
    const task = uploadQueue.shift();
    uploadSingleFile(task.file, task.fileId, task.domId).finally(()=>{
      runningCount--;
      runUploadQueue();
    })
  }

  // 单文件分片上传
  async function uploadSingleFile(file, fileId, domId){
    const $box = $(`#${domId}`);
    const $bar = $box.find('.layui-progress-bar');
    const $tip = $box.find('.tip-text');
    const totalChunks = Math.ceil(file.size / chunkSize);

    let uploadedTotal = 0;
    let lastLoaded = 0;
    let lastTime = Date.now();
    $tip.text('分片上传中...');

    try {
      for(let i=0; i<totalChunks; i++){
        const start = i * chunkSize;
        const end = Math.min(start + chunkSize, file.size);
        const chunk = file.slice(start, end);

        const formData = new FormData();
        formData.append('file', chunk);
        formData.append('fileId', fileId);
        formData.append('index', i);

        await $.ajax({
          url: '/upload/chunk',
          type: 'POST',
          data: formData,
          processData: false,
          contentType: false,
          xhr: function(){
            const xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', e=>{
              if(!e.lengthComputable) return;
              const now = Date.now();
              const deltaTime = now - lastTime;
              const allLoaded = uploadedTotal + e.loaded;

              let speed = 0;
              if(deltaTime > 0){
                const deltaLoaded = e.loaded - lastLoaded;
                speed = (deltaLoaded / deltaTime) * 1000 / 1024;
              }
              lastLoaded = e.loaded;
              lastTime = now;

              const percent = (allLoaded / file.size * 100).toFixed(1);
              $bar.css('width', percent + '%');
              $tip.text(`上传进度：${percent}% | 速度：${speed.toFixed(1)} KB/s`);
            })
            return xhr;
          }
        })
        uploadedTotal += chunk.size;
        lastLoaded = 0;
      }

      // 合并接口
      $.post('/upload/merge', {
        fileId: fileId,
        fileName: file.name,
        total: totalChunks
      }, res=>{
        if(res.code === 1){
          $bar.css('width', '100%');
          $tip.html('<span style="color:green;">✅上传成功，文件地址：</span>' + res.url);
        }else{
          $tip.html('<span style="color:red;">❌上传失败：' + res.msg + '</span>');
        }
      })
    } catch(err){
      $tip.html('<span style="color:red;">❌网络异常，上传失败</span>');
    }
  }

  // 前端安全校验
  function checkFileSafe(file){
    const fileName = file.name;
    if(file.size > maxTotalSize){
      layer.msg(`【${fileName}】文件超过10GB，禁止上传`, {icon:2});
      return false;
    }
    const suffix = fileName.split('.').pop().toLowerCase();
    if(!allowExt.includes(suffix)){
      layer.msg(`【${fileName}】文件类型不允许上传`, {icon:2});
      return false;
    }
    if(/(\.\.|\/|\\|\%00)/.test(fileName)){
      layer.msg(`【${fileName}】文件名包含非法字符`, {icon:2});
      return false;
    }
    return true;
  }

  // 文件大小格式化
  function formatSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
    if(bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }
})
</script>
</body>
